name: Tests

on: ['push', 'pull_request']

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: ['8.4']
        laravel: ['^12.0', '^13.0']

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - Laravel ${{ matrix.laravel }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: none

    - name: Install PHP dependencies
      run: composer update --prefer-stable --no-interaction --no-progress --with "illuminate/view:${{ matrix.laravel }}" --with "illuminate/config:${{ matrix.laravel }}"

    - name: Unit Tests
      run: composer test

    - name: Source Linter
      run: composer lint
